name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly advisory sweep even when the repo is quiet — new RUSTSEC
  # entries surface without waiting for a push or PR.
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The plugin ABI test needs the demo plugin cdylib, which `cargo test`
      # does not build on its own.
      - name: Build plugins
        run: cargo build -p dpa-plugin-demo

      - name: test
        run: cargo test --workspace

      - name: i18n key parity
        run: python3 scripts/check_i18n_keys.py

      # Use the repository's cargo-deny policy so explicitly reviewed and
      # unreachable advisories stay registered in deny.toml rather than being
      # duplicated in a separate audit configuration.
      - name: cargo deny advisories
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories

      - name: package hygiene
        run: |
          cargo package --allow-dirty --list > /tmp/pkg_list.txt
          if grep -Eq '^output/|^archive/|^dist/|^temp/|^target/|\.(dll|so|dylib)$' /tmp/pkg_list.txt; then
            echo "::error::crates.io package contains non-source artifacts"
            grep -E '^output/|^archive/|^dist/|^temp/|^target/|\.(dll|so|dylib)$' /tmp/pkg_list.txt
            exit 1
          fi

  # The Windows-specific surface (ConsoleOutputCP, BOM/CRLF handling,
  # two-phase output rename, UNC paths) needs real platform coverage, not just
  # Ubuntu. Keep audit/i18n/package-hygiene on Ubuntu where their shell tools
  # are guaranteed; fmt/clippy/test cover both OSes.
  quality-windows:
    name: quality-gate-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build plugins
        run: cargo build -p dpa-plugin-demo

      - name: test
        run: cargo test --workspace

  # Differential tests: compare core ops against independent Python
  # implementations. A missing reference or mismatch fails the job.
  difftest:
    name: differential-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Install Python deps
        run: python3 -m pip install --disable-pip-version-check -r requirements-difftest.txt

      - name: Run differential tests
        run: python3 scripts/difftest.py --exe target/release/dpa --cases all --strict

  # Feature-matrix coverage. The lib must build without the
  # default "cli" feature and on wasm32-unknown-unknown (host-only deps are
  # cfg-gated per target in Cargo.toml); neither combination was exercised by
  # CI before.
  feature-matrix:
    name: feature-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: check no-default-features (lib)
        run: cargo check -p dpa --lib --no-default-features

      - name: check wasm32 (lib, no-default)
        run: cargo check -p dpa --target wasm32-unknown-unknown --lib --no-default-features
