[package]
name = "dpa-wasm"
version = "1.0.0"
edition = "2024"
description = "dpa Web/WASM engine binding - reuses dpa's Rust engine (engine/ops/i18n) on wasm32"
license = "Apache-2.0"
repository = "https://github.com/dpa-org/dpa"
authors = ["dpa-org"]
rust-version = "1.89"
publish = false

[lib]
name = "dpa_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
dpa = { path = ".." }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
